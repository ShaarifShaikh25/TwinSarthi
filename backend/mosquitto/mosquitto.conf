# Eclipse Mosquitto MQTT Broker Configuration for POLAR-TWIN
# Ingestion bridge for IoT sensor simulators and physical edge gateways

listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
